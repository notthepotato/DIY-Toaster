; ToasterPDP - firmware for the DIY-Toaster power distribution board (XIAO ESP32-C6)
; Open this "Firmware" folder in VS Code + PlatformIO and press Upload.
; The sketch lives in ./ToasterPDP so the same folder also opens in the Arduino IDE.

[platformio]
src_dir = ToasterPDP
default_envs = xiao-esp32c6

[env:xiao-esp32c6]
; same platform release the ProtoDeck uses (Arduino core 3.x / IDF 5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  adafruit/Adafruit NeoPixel@1.15.5
; build_flags =
;   -DPL_NET_ID=0x1234      ; private ProtoLink network id - set the same on the deck and every node
