; PROTO//DECK - CrowPanel Advance 7.0" HMI (ESP32-S3-WROOM-1-N16R8)
; Open this folder in VS Code + PlatformIO, then Upload.
; The sketch lives in ./ProtoDeck so the same folder also opens in the Arduino IDE.

[platformio]
src_dir = ProtoDeck
default_envs = crowpanel-advance-7

[env:crowpanel-advance-7]
; same platform release Elecrow uses for the V1.3+ examples (Arduino core 3.x / IDF 5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_INCLUDE_SIMPLE
  -I ProtoDeck
;  -DBOARD_REV=12          ; uncomment for a V1.2 board (V1.0 is auto-detected)
;  -DPL_NET_ID=0x1234      ; private network id - set the same on every node

lib_deps =
  lvgl/lvgl@9.2.2
